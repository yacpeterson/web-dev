<!DOCTYPE html>
<html>
<head>
  <title>List Maker</title>
  <script defer src="listmaker.js"></script>
  <link rel="stylesheet" href="listmaker.css">
</head>
<body>
  <div id="h1-div">
    <h1>List Maker</h1>
  </div>

  <div id="item-div">
    <input id="text" type="text" placeholder="Enter Item...">
    <button id="add">Add Item</button>
    <button id="clear">Clear List</button>
  </div>

  <div id="container">
    <div id="list-div">
      <ul id="list">
        <span>No Items</span>
      </ul>
    </div>
  </div>
</body>
</html>
