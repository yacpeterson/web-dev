<!DOCTYPE html>
<html>

<head>
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="tictactoe.css">
  <script src="tictactoe.js" defer></script>
</head>

<body>
  <div class="x-wins">
    <p>X Wins:</p>
    <p id="x-wins">0
    <p>
  </div>
  <div class="o-wins">
    <p>O Wins:</p>
    <p id="o-wins">0</p>
  </div>

  <div class="board">
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
  </div>

  <div id="end">
    <div>
      <p>67</p>
      <button onclick="handlePlayAgain()">Play Again</button>
    </div>
  </div>
</body>

</html>
